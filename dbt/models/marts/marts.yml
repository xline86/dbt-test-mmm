        description: ワールドID。
        tests:
          - not_null
      - name: guild_id
        description: ギルドID。
        tests:
          - not_null
      - name: guild_name
        description: ギルド名。
      - name: bp
        description: ギルドBP。
      - name: guild_level
        description: ギルドレベル。
      - name: stock
        description: ギルドストック。
      - name: exp
        description: ギルド経験値。
      - name: num_members
        description: ギルドメンバー数。
      - name: leader_id
        description: リーダーID。
      - name: leader_name
        description: リーダー名。
      - name: free_join
        description: 自由加入可否。
      - name: bp_requirement
        description: 加入に必要なBP。
      - name: bp_ranker_num
        description: 同じ収集日時にBPランキングへ登場した所属プレイヤー数。
      - name: bp_top_player_name
        description: 同じ収集日時にBPランキングで最上位だった所属プレイヤー名。
      - name: bp_top_player_id
        description: 同じ収集日時にBPランキングで最上位だった所属プレイヤーID。
      - name: bp_top_player_bp
        description: 同じ収集日時にBPランキングで最上位だった所属プレイヤーのBP。
      - name: collected_at
        description: データ収集日時。
        tests:
          - not_null

