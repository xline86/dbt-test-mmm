version: 2

models:
  - name: mart_player_ranking_latest
    description: 各ワールド・ランキング種別ごとの最新プレイヤーランキング。
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - world_id
              - ranking_type
              - rank_position
    columns:
      - name: world_id
        description: ワールドID。
        tests:
          - not_null
      - name: ranking_type
        description: ランキング種別。
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bp, rank, quest, tower, tower_red, tower_green, tower_blue, tower_yellow]
      - name: rank_position
        description: ランキング順位。
        tests:
          - not_null
      - name: player_id
        description: プレイヤーID。
        tests:
          - not_null
      - name: player_name
        description: プレイヤー名。
      - name: score_value
        description: ランキング種別に対応するスコア。
        tests:
          - not_null
      - name: guild_bp_ranking_position
        description: 同じ収集日時における所属ギルドのBPランキング順位。
      - name: collected_at
        description: データ収集日時。
        tests:
          - not_null
      - name: source_file
        description: 元JSONファイル名。

  - name: mart_top_player_profile_latest
    description: 最新のプレイヤープロフィール。ランキングに登場したプレイヤーのみを含む。
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - world_id
              - player_id
    columns:
      - name: world_id
        description: ワールドID。
        tests:
          - not_null
      - name: player_id
        description: プレイヤーID。
        tests:
          - not_null
      - name: player_name
        description: プレイヤー名。
      - name: current_bp
        description: 現在のBP。
      - name: player_rank
        description: 現在のプレイヤーランク。
      - name: quest_id
        description: 現在のクエスト進捗ID。
      - name: tower_id
        description: 現在の塔進捗ID。
      - name: guild_id
        description: 所属ギルドID。
      - name: guild_name
        description: 所属ギルド名。
      - name: guild_position
        description: ギルド内役職。
      - name: prev_legend_league_class
        description: 前回のレジェンドリーグクラス。
      - name: collected_at
        description: データ収集日時。
        tests:
          - not_null

  - name: mart_guild_ranking_latest
    description: 各ワールド・ランキング種別ごとの最新ギルドランキング。
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - world_id
              - ranking_type
              - rank_position
    columns:
      - name: world_id
        description: ワールドID。
        tests:
          - not_null
      - name: ranking_type
        description: ランキング種別。
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [bp, level, stock]
      - name: rank_position
        description: ランキング順位。
        tests:
          - not_null
      - name: guild_id
        description: ギルドID。
        tests:
          - not_null
      - name: guild_name
        description: ギルド名。
      - name: score_value
        description: ランキング種別に対応するスコア。
        tests:
          - not_null
      - name: collected_at
        description: データ収集日時。
        tests:
          - not_null

  - name: mart_guild_profile_latest
    description: 最新のギルドプロフィール。
    tests:
      - dbt_utils.unique_combination_of_columns:
