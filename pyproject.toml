[project]
name = "dbt-test"
version = "0.1.0"
description = "Minimal Snowflake and dbt ELT project for game ranking data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1.8",
    "dbt-core>=1.10.0",
    "dbt-snowflake>=1.10.0",
    "python-dotenv>=1.1.0",
    "snowflake-cli>=3.12.0",
    "snowflake-connector-python>=3.15.0",
]

[project.scripts]
dbt-test = "dbt_test_mmm.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.410",
    "pytest>=8.4.0",
    "ruff>=0.11.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbt_test_mmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
